name: Build bacpro for Windows

# Produces dist/bacpro.exe on a free GitHub-hosted Windows runner.
# You do NOT need Python on your own machine.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Actions tab -> "Build bacpro for Windows" -> Run workflow.
#   3. Download the "bacpro-windows" artifact when it finishes (~3 min).
#
# Tagging a commit (e.g. git tag v1.0.0 && git push --tags) additionally
# attaches bacpro.exe to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run protocol tests
        run: |
          python test_protocol.py
          python test_mstp.py
          python test_bbmd.py
          python test_modbus.py
          python test_modbus_api.py

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build executable
        run: pyinstaller bacpro.spec --noconfirm --clean

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\bacpro.exe" `
               -ArgumentList "--no-browser","--port","5099" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5099/api/status" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "bacpro.exe did not serve /api/status" }
          Write-Host "Smoke test passed."

      - name: Build installer (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $iscc) {
            & $iscc "installer\bacpro.iss"
          } else {
            Write-Warning "Inno Setup not found - skipping installer."
          }

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: bacpro-windows
          path: dist/bacpro.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bacpro-windows-installer
          path: installer/Output/bacpro-setup.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bacpro.exe
            installer/Output/bacpro-setup.exe
